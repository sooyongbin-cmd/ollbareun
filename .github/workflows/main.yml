name: Deploy education-reminders

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/education-reminders/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: wexcijqchwwkxpkwajbf

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy education-reminders --project-ref "$SUPABASE_PROJECT_ID"
