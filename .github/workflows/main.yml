name: Deploy education-reminders

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - "supabase/functions/education-reminders/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: wexcijqchwwkxpkwajbf
      # GitHub-hosted runners use IPv4, so use the project's Session Pooler.
      SUPABASE_DB_HOST: aws-1-ap-northeast-1.pooler.supabase.com
      SUPABASE_DB_USER: postgres.wexcijqchwwkxpkwajbf

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build database connection URL
        shell: bash
        run: |
          db_password=$(node -e 'process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
          echo "::add-mask::$db_password"
          printf '%s\n' "SUPABASE_DB_URL=postgresql://${SUPABASE_DB_USER}:${db_password}@${SUPABASE_DB_HOST}:5432/postgres?sslmode=require" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - run: supabase functions deploy education-reminders --project-ref "$SUPABASE_PROJECT_ID"
