name: Olbareum worker TWA
on:
  pull_request:
    paths:
      - 'android/olbareum-worker/**'
      - '.github/workflows/olbareum-worker.yml'
  push:
    branches: [main, 'codex/olbareum-worker-twa']
    paths:
      - 'android/olbareum-worker/**'
      - '.github/workflows/olbareum-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test android/olbareum-worker/scripts/assetlinks.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android/olbareum-worker lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: olbareum-worker-debug
          path: android/olbareum-worker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olbareum-worker-lint
          path: android/olbareum-worker/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
